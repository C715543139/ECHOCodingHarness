name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Run offline Fake Provider evals
        run: pnpm eval:offline

      - name: Demo-loop smoke
        run: pnpm smoke:demo

      - name: Artifact cwd smoke
        run: pnpm smoke:artifact

      - name: Web artifact smoke
        run: pnpm smoke:web-artifact

      - name: Scan secrets
        run: pnpm scan:secrets

      - name: Scan dual-blind identity
        run: pnpm scan:identity

      - name: Test known malicious scan samples
        run: pnpm scan:self-test
