name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

      - name: Run offline Fake Provider evals
        run: pnpm eval:offline

      - name: Demo-loop smoke
        run: pnpm smoke:demo

      - name: Artifact cwd smoke
        run: pnpm smoke:artifact

      - name: Web artifact smoke
        run: pnpm smoke:web-artifact

      - name: Scan secrets
        run: pnpm scan:secrets

      - name: Scan dual-blind identity
        run: pnpm scan:identity

      - name: Test known malicious scan samples
        run: pnpm scan:self-test

      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium

      - name: Run Web browser flows
        id: web-e2e
        continue-on-error: true
        run: pnpm test:web:e2e

      - name: Fail-closed scan Web browser artifacts
        id: web-artifact-scan
        if: always()
        shell: pwsh
        run: node scripts/scan-web-artifacts.mjs --root "$env:RUNNER_TEMP\echo-p2-b4-playwright"

      - name: Upload scanned Web failure evidence
        if: >-
          always() &&
          steps.web-e2e.outcome == 'failure' &&
          steps.web-artifact-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-failure-evidence
          path: ${{ runner.temp }}\echo-p2-b4-playwright
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Web browser result
        if: always() && steps.web-e2e.outcome == 'failure'
        shell: pwsh
        run: exit 1
